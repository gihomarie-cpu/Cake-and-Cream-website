<div class="form-container">
      <h2>Customer information</h2> 

  <!-- Order form and thank-you message section -->
  <div id="order-message" class="order-message" aria-live="polite"></div>
  <form action="select-option2.php" method="POST" id="order-form">
    <div class="form-group">
    <label for="size">Select cake size</label>
    <select name="cake_size" id="size-option">
      <option value="small">Small</option>
      <option value="small-twolayers">small with two layers</option>
      <option value="medium">medium</option>
      <option value="medium-twolayers">medium with two layers</option>
      <option value="larger">large</option>
      <option value="larger-twolayers">large with two layers</option>
    </select><br>
    </div>
    <div class="form-group">
    <label for="flavor-option">Select your flavor</label>
    <select name="cake_flavor" id="flavor-option">
      <option value="coconut">Coconut</option>
      <option value="chocolate">Chocolate</option>
      <option value="banana">Banana</option>
      <option value="pineapple">Pineapple</option>
      <option value="mango">Mango</option>
    </select><br>
    </div>
    <div class="form-group">
    <label for="cakename">Which name would you like on the cake?</label> <br>
    <textarea name="cake_name" id="cakename" rows="6" cols="70" placeholder="Write the name you want on the cake"></textarea><br>
    </div>
     <div class="form-group">
    <label for="cake_number">How many cakes do you need?</label>
    <input type="number" name="cake_number" id="cake_number" min="1" value="1" placeholder="Number of cakes">
    </div>
    <div class="form-group">
    <label for="email">Write your email </label>
    <input type="email" name="email" id="email" placeholder="e.g. john@gmail.com" required><br>
    </div>
    <div class="form-group">
    <label for="telephone">Fill your phone number</label>
    <input type="tel" name="telephone" id="telephone" required><br>
    </div>
    <div class="form-group">
    <label for="location">Which location should delivery go to?</label>
    <input type="text" name="location" id="location" placeholder="Write your location"><br>
    </div>
    <div class="form-group">
    <label for="payment_method">Which payment method will you use?</label>
    <select name="payment_method" id="payment_method">
    <option value="paypal">Paypal</option>
    <option value="mastercard">Mastercard</option>
    <option value="visa">Visa</option>
    <option value="verve">Verve</option>
    <option value="mobilemoney">Mobile money</option>
    </select>
    </div>
    <div class="form-group">
    <label for="delivery_time">When will you need your products to arrive?</label>
    <input type="text" name="delivery_time" id="delivery_time" placeholder="e.g. 21/04/2026"><br>
    </div>
    <div class="form-group">
    <input type="submit" class="submit" name="submit">
  </form>
  </div>
